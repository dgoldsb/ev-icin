<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf6ec">
  <title>Ev İçin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back-link" href="index.html" id="back-link">← Tarifler</a>
      <span class="topbar-spacer"></span>
      <nav class="page-nav" id="page-nav" aria-label="Recipe navigation" style="display: contents;"></nav>
      <div class="lang-switch" role="group" aria-label="Dil / Language" id="lang-switch"></div>
    </div>
  </header>
  <div class="wrap">
    <h1 class="recipe-title" id="title">…</h1>
    <p class="recipe-meta" id="meta"></p>
    <main id="content"></main>
    <div class="ornament" aria-hidden="true">❧</div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Previous and next recipe"></nav>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    let lang;
    if (params.has('lang')) {
      lang = params.get('lang') === 'en' ? 'en' : 'tr';
    } else {
      try { lang = localStorage.getItem('evicin-lang') || 'tr'; } catch (e) { lang = 'tr'; }
    }
    try { localStorage.setItem('evicin-lang', lang); } catch (e) {}
    const suffix = lang === 'tr' ? '_tr' : '_en';

    document.documentElement.lang = lang;

    const STRINGS = lang === 'tr'
      ? { back: '← Tarifler', ingredients: 'Malzemeler', instructions: 'İşlemler',
          variation: 'Çeşit', page: 's.', inBook: 'Kitapta', prev: 'Önceki', next: 'Sonraki',
          notFound: 'Tarif bulunamadı', loadError: 'Bu tarif yüklenemedi.' }
      : { back: '← Recipes', ingredients: 'Ingredients', instructions: 'Instructions',
          variation: 'Variation', page: 'p.', inBook: 'In the book', prev: 'Previous', next: 'Next',
          notFound: 'Recipe not found', loadError: 'Could not load this recipe.' };

    document.getElementById('back-link').textContent = STRINGS.back;

    function langURL(targetLang) {
      const next = new URLSearchParams(window.location.search);
      next.set('lang', targetLang);
      return `?${next.toString()}`;
    }

    function recipeURL(slug) {
      const next = new URLSearchParams();
      next.set('id', slug);
      if (lang === 'en') next.set('lang', 'en');
      return `?${next.toString()}`;
    }

    function pageLabel(r) {
      return r.page_end ? `${r.page}–${r.page_end}` : `${r.page}`;
    }

    // Language switch is two links so it works as plain navigation
    document.getElementById('lang-switch').innerHTML = `
      <a class="lang-btn${lang === 'tr' ? ' active' : ''}" href="${langURL('tr')}" ${lang === 'tr' ? 'aria-current="true"' : ''}>TR</a>
      <a class="lang-btn${lang === 'en' ? ' active' : ''}" href="${langURL('en')}" ${lang === 'en' ? 'aria-current="true"' : ''}>EN</a>`;

    if (!id) {
      document.getElementById('title').textContent = STRINGS.notFound;
    } else {
      Promise.all([
        fetch(`recipes/${id}.json`).then(r => { if (!r.ok) throw new Error(); return r.json(); }),
        fetch('index.json').then(r => r.json())
      ])
        .then(([recipe, index]) => {
          render(recipe);
          renderNav(index);
        })
        .catch(() => {
          document.getElementById('title').textContent = STRINGS.notFound;
          document.getElementById('content').innerHTML = `<p>${STRINGS.loadError}</p>`;
        });
    }

    function render(r) {
      const name = r[`name${suffix}`];
      const ingredients = r[`ingredients${suffix}`];
      const instructions = r[`instructions${suffix}`];
      const notes = r[`notes${suffix}`];

      document.title = `${name} — Ev İçin`;
      document.getElementById('title').textContent = name;
      document.getElementById('meta').textContent =
        `${STRINGS.inBook}: ${STRINGS.page} ${pageLabel(r)}`;

      // Section-intro pages carry no recipe scaffolding — just a title and body paragraphs.
      if (r.kind === 'section') {
        const body = r[`body${suffix}`] || [];
        document.getElementById('content').innerHTML = `
        <section class="recipe-content section-intro">
          ${body.map(p => `<p>${p}</p>`).join('\n          ')}
        </section>`;
        return;
      }

      const hasIngredients = Array.isArray(ingredients) && ingredients.length > 0;
      let html = '<section class="recipe-content">';
      if (hasIngredients) {
        html += `
          <div class="ingredients-card">
            <h2>${STRINGS.ingredients}</h2>
            <ul>
              ${ingredients.map(i => `<li>${i}</li>`).join('\n              ')}
            </ul>
          </div>`;
      }
      html += `
          <h2 class="steps-heading">${STRINGS.instructions}</h2>
          <ol class="steps">
            ${instructions.map(s => `<li><span>${s}</span></li>`).join('\n            ')}
          </ol>`;

      if (notes) {
        const notesArr = Array.isArray(notes) ? notes : [notes];
        html += notesArr.map(n => `\n          <p class="recipe-note">${n}</p>`).join('');
      }

      if (r.variations && r.variations.length > 0) {
        r.variations.forEach(v => {
          const vname = v[`name${suffix}`];
          const vdesc = v[`description${suffix}`];
          html += `
          <h3>${STRINGS.variation}: ${vname}</h3>
          <p>${vdesc}</p>`;
        });
      }

      html += '\n        </section>';
      document.getElementById('content').innerHTML = html;
    }

    function renderNav(index) {
      const i = index.findIndex(r => r.slug === id);
      const prev = index[i - 1] ?? null;
      const next = index[i + 1] ?? null;
      const name = r => lang === 'tr' ? r.name_tr : r.name_en;

      document.getElementById('page-nav').innerHTML = `
        ${prev
          ? `<a class="nav-btn" href="${recipeURL(prev.slug)}" aria-label="${STRINGS.prev}: ${name(prev)}">←</a>`
          : '<span class="nav-btn disabled" aria-hidden="true">←</span>'}
        ${next
          ? `<a class="nav-btn" href="${recipeURL(next.slug)}" aria-label="${STRINGS.next}: ${name(next)}">→</a>`
          : '<span class="nav-btn disabled" aria-hidden="true">→</span>'}`;

      document.getElementById('bottom-nav').innerHTML = `
        ${prev
          ? `<a class="bnav bnav-prev" href="${recipeURL(prev.slug)}">
               <span class="bnav-label">← ${STRINGS.prev}</span>
               <span class="bnav-name">${name(prev)}</span>
             </a>`
          : '<span class="bnav bnav-empty"></span>'}
        ${next
          ? `<a class="bnav bnav-next" href="${recipeURL(next.slug)}">
               <span class="bnav-label">${STRINGS.next} →</span>
               <span class="bnav-name">${name(next)}</span>
             </a>`
          : '<span class="bnav bnav-empty"></span>'}`;
    }
  </script>
</body>
</html>
